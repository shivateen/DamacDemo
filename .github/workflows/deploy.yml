name: Build & Deploy to public site

# Builds the platform in THIS private source repo and publishes ONLY the
# compiled output (public/) to a separate PUBLIC repo, which serves GitHub
# Pages. Source, history and docs stay private; only built assets are public.

on:
  push:
    branches: [main]
  workflow_dispatch:       # allow manual trigger from the Actions tab

# ── One-time setup required for this workflow to succeed ──────────────────────
# 1. Create a PUBLIC repo:  shivateen/damac-finiq   (can be empty)
# 2. Create a fine-grained Personal Access Token:
#      Resource owner = shivateen
#      Repository access = Only select repositories → damac-finiq
#      Permissions → Repository permissions → Contents: Read and write
# 3. In THIS repo: Settings → Secrets and variables → Actions → New secret
#      Name = SITE_DEPLOY_TOKEN   Value = the token from step 2
# 4. After the first successful run, in damac-finiq:
#      Settings → Pages → Source = Deploy from a branch → main → / (root)

jobs:
  build-deploy:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (private source)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build platform
        run: python3 scripts/build_platform.py

      - name: Verify output
        run: |
          test -f public/index.html
          test -f public/app-closeiq.html
          test -d public/valuationiq
          grep -q "Finance AI Platform" public/index.html
          echo "✓ Platform build verified"

      - name: Publish compiled site to public repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          external_repository: shivateen/damac-finiq
          publish_branch: main
          publish_dir: ./public
          force_orphan: true          # keep only the latest build — no history in the public repo
          commit_message: "Deploy build ${{ github.sha }}"
