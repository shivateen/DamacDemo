name: Build & Deploy CloseIQ

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  # ── Job 1: Build ──────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build index.html
        run: python3 scripts/build_platform.py

      - name: Verify output
        run: |
          ls -lah public/index.html
          grep -q "Finance AI Platform" public/index.html && test -f public/app-closeiq.html && echo "✓ Platform build verified"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: closeiq-dist
          path: public/
          retention-days: 7

  # ── Job 2a: Deploy to GitHub Pages ────────────────────────────────────────
  # Enable this if you want to host on https://[org].github.io/closeiq
  # Set Settings → Pages → Source = GitHub Actions in your repo first.
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: closeiq-dist
          path: public/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Job 2b: Deploy to VPS via SSH ─────────────────────────────────────────
